<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("csw");
    // }, 2000)

    // const sayName = function(){
    //     console.log("csw");
    // }
    // setTimeout(sayName, 2000)

    const changeText = function(){
        document.querySelector('h1').innerHTML = "JS LEARNING"
    };
    // setTimeout(changeText, 2000)

    const changeH1 = setTimeout(changeText, 2000)

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeH1);
        console.log("STOPPED");
    })
</script>
</html>
